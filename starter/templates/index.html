<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Sudoku Game</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <h1>Sudoku Game</h1>
  <div id="sudoku-board"></div>
  <div id="leaderboard-section">
    <h2>Top 10 Leaderboard</h2>
    <div class="leaderboard-controls">
      <input id="player-name" type="text" maxlength="20" placeholder="Your name" />
      <button id="save-score">Save Score</button>
    </div>
    <ol id="leaderboard-list"></ol>
  </div>
  <div class="controls">
    <button id="theme-toggle" type="button">Dark Mode</button>
    <span id="timer">Time: 00:00</span>
    <label for="difficulty-select">Difficulty:</label>
    <select id="difficulty-select">
      <option value="easy">Easy</option>
      <option value="medium" selected>Medium</option>
      <option value="hard">Hard</option>
    </select>
    <button id="new-game">New Game</button>
    <button id="check-solution">Check Solution</button>
    <button id="check-puzzle">Check Puzzle</button>
    <button id="hint-button">Hint</button>
    <span id="message"></span>
  </div>
  <script src="/static/main.js"></script>
</body>
</html>
